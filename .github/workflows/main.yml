name: Render Keep Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render's 15-minute sleep timer
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s --max-time 15 https://telecom-ai-predictor.onrender.com/ping || true
          curl -s --max-time 15 https://indian-city-rent-predictor.onrender.com/ping || true